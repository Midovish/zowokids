<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Rapide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }
        body {
            background: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* dynamic viewport height (mobile) */
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            touch-action: none;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
        }

        /* === Modal responsive === */
        #colorModal { padding: 12px; }
        #colorModalBox {
            background: linear-gradient(160deg, #1a1a2e, #16213e);
            border: 2px solid rgba(255,150,0,0.5);
            border-radius: 20px;
            padding: clamp(20px, 4vw, 36px) clamp(16px, 3vw, 30px);
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255,120,0,0.35);
        }
        #colorModalBox .title {
            font-size: clamp(22px, 5vw, 30px);
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }
        #colorModalBox .subtitle {
            color: #FF9800;
            font-size: clamp(13px, 3vw, 15px);
            margin-bottom: clamp(18px, 4vw, 28px);
        }
        #carChoices {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-bottom: clamp(18px, 4vw, 28px);
            gap: 8px;
        }
        #chosenLabel {
            color: #FFD700;
            font-weight: bold;
            font-size: clamp(14px, 3vw, 16px);
            margin-bottom: 18px;
            min-height: 20px;
        }
        #startBtn {
            color: #fff;
            border: none;
            padding: clamp(12px, 3vw, 14px) clamp(28px, 6vw, 40px);
            border-radius: 50px;
            font-size: clamp(15px, 3vw, 17px);
            font-weight: bold;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
            background: linear-gradient(90deg, #757575, #9E9E9E);
            cursor: not-allowed;
        }
        #startBtn:not(:disabled) { cursor: pointer; }

        /* Cacher la barre d'adresse mobile autant que possible */
        @media (max-width: 600px) {
            body { align-items: flex-start; }
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Modal choix couleur -->
<div id="colorModal" style="
    position:fixed; inset:0; background:rgba(0,0,0,0.88);
    display:flex; align-items:center; justify-content:center;
    z-index:100;">
  <div id="colorModalBox">
    <!-- Logo ZowoKids (chargé en JS) -->
    <div id="modalLogoSlot" style="margin-bottom:6px;"></div>

    <div class="title">✈️ COURSE D'AVION</div>
    <div class="subtitle">Choisis ton avion</div>

    <div id="carChoices"></div>

    <div id="chosenLabel"></div>

    <button id="startBtn" disabled>DÉCOLLER !</button>
  </div>
</div>

<script>
// ============================================================
//  AUDIO ENGINE (Web Audio API – aucun fichier externe)
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Moteur d'avion : bruit filtré + oscillateur basse fréquence (rotation hélice)
let engineGain = null, engineFilter = null, engineSource = null;
let propOsc = null, propGain = null;
function startEngine() {
    ensureAudio();
    if (engineSource) return;

    // 1) Bruit "souffle réacteur" — bruit blanc avec lowpass qui laisse passer le grave
    const bufSize = audioCtx.sampleRate * 2;
    const buffer  = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data    = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    engineSource = audioCtx.createBufferSource();
    engineSource.buffer = buffer;
    engineSource.loop   = true;

    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type      = 'lowpass';        // lowpass au lieu de bandpass
    engineFilter.frequency.value = 350;        // souffle plus large
    engineFilter.Q.value   = 0.6;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.13;

    engineSource.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineSource.start();

    // 2) Hélice — oscillateur sine basse fréquence qui simule le "vroum-vroum-vroum"
    propOsc = audioCtx.createOscillator();
    propOsc.type = 'sawtooth';
    propOsc.frequency.value = 90;              // grave d'hélice
    propGain = audioCtx.createGain();
    propGain.gain.value = 0.05;
    // léger LFO qui module le gain pour donner le rythme des pales
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 18;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.03;
    lfo.connect(lfoGain);
    lfoGain.connect(propGain.gain);
    propOsc.connect(propGain);
    propGain.connect(audioCtx.destination);
    propOsc.start();
    lfo.start();
    // garder une référence pour pouvoir les arrêter
    propOsc._lfo = lfo;
}

function stopEngine() {
    if (!engineSource) return;
    try { engineSource.stop(); } catch(e){}
    if (propOsc) {
        try { propOsc.stop(); } catch(e){}
        try { propOsc._lfo.stop(); } catch(e){}
    }
    engineSource = null; engineGain = null; engineFilter = null;
    propOsc = null; propGain = null;
}

function setEngineSpeed(spd) {
    if (!engineFilter) return;
    // souffle : lowpass s'élargit avec la vitesse
    const f = 350 + (spd - 4) * 80;
    engineFilter.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.1);
    engineGain.gain.setTargetAtTime(0.12 + (spd - 4) * 0.008, audioCtx.currentTime, 0.1);
    // hélice : tourne plus vite
    if (propOsc) {
        propOsc.frequency.setTargetAtTime(90 + (spd - 4) * 18, audioCtx.currentTime, 0.1);
    }
}

// Collision avion – impact métallique aigu + descente
function playCollision() {
    ensureAudio();
    // Cri métallique aigu qui descend
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type  = 'sawtooth';
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.45);
    g.gain.setValueAtTime(0.45, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.46);

    // Crash métallique (bruit avec highpass — "tôles")
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    const ns = audioCtx.createBufferSource();
    ns.buffer = nb;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'highpass'; nf.frequency.value = 1500;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.5, audioCtx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
    ns.start();
}

// Game Over – descente dramatique
function playGameOver() {
    ensureAudio();
    [220, 185, 155, 110].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.35, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.33);
    });
}

// Bonus (avion croisé) – swoosh court avec effet doppler
function playDodge() {
    ensureAudio();
    // Petit whoosh d'air
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1) * (1 - i/nd.length);
    const ns = audioCtx.createBufferSource();
    ns.buffer = nb;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 1500; nf.Q.value = 4;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.18, audioCtx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
    ns.start();
    // petit "ding" aigu pour le score
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(900, audioCtx.currentTime);
    g.gain.setValueAtTime(0.10, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.13);
}

// Nouveau record !
function playRecord() {
    ensureAudio();
    [600, 750, 900, 1100].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.1;
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.16);
    });
}

// Début de partie (petit jingle)
function playStart() {
    ensureAudio();
    [440, 550, 660, 880].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.19);
    });
}

// Sélection d'une voiture dans le menu – petit "pop" court
function playSelect() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(700, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.08);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.11);
}

// Clic sur DECOLLER – son de décollage avion (rampe montante longue + whoosh)
function playLaunch() {
    ensureAudio();
    // Montée progressive type "réacteur qui prend de la puissance"
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type  = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.6);
    g.gain.setValueAtTime(0.0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.1);
    g.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.5);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.71);

    // Whoosh aérien long (bruit blanc highpass qui s'éteint)
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.7, audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1) * (1 - i/nd.length);
    const ns = audioCtx.createBufferSource();
    ns.buffer = nb;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'highpass'; nf.frequency.value = 800;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.25, audioCtx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
    ns.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
    ns.start();
}

// Affiche le logo en haut de la modale dès qu'il est chargé
function renderModalLogo() {
    const slot = document.getElementById('modalLogoSlot');
    if (!slot) return;
    slot.innerHTML = '';
    const img = document.createElement('img');
    img.src = LOGO_IMG.src;
    img.alt = 'ZowoKids';
    img.style.cssText = 'max-width:220px; width:65%; height:auto; display:block; margin:0 auto 8px;';
    slot.appendChild(img);
}

    { color:'#1DE9B6', accent:'#B2DFDB', label:'MENTHE',    family:'mint'      },  // Ludique
    { color:'#212121', accent:'#9E9E9E', label:'NOIR',      family:'black'     },
    { color:'#5D4037', accent:'#D7CCC8', label:'MARRON',    family:'brown'     },
];

// Pool de couleurs adverses = 7 couleurs joueur + 5 couleurs exclusives
const COLOR_POOL = PLAYER_POOL.concat(ENEMY_EXTRA);

// Tire 3 couleurs au hasard parmi les 7 couleurs joueur (sans répétition)
function pickRandomCarChoices() {
    const pool = PLAYER_POOL.slice();
    const picks = [];
    for (let i = 0; i < 3; i++) {
        const idx = Math.floor(Math.random() * pool.length);
        picks.push(pool.splice(idx, 1)[0]);
    }
    return picks;
}

const CAR_CHOICES = pickRandomCarChoices();

let selectedChoiceIdx = -1;

// ============================================================
//  SETUP
// ============================================================
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 480, H = 700;
canvas.width = W; canvas.height = H;

// ECHELLE DYNAMIQUE — recalculée à chaque redimensionnement
let scale = 1;

function resizeCanvas() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // On garde le ratio du jeu, on remplit au mieux l'écran
    // Sur PC : on plafonne à 1.4x pour ne pas avoir une interface géante
    // Sur mobile/tablette : on remplit l'écran (laisser un petit padding sur PC)
    const isMobile = vw < 768;
    const padding = isMobile ? 0 : 20;
    const maxScale = isMobile ? 3 : 1.5;
    scale = Math.min(
        (vw - padding * 2) / W,
        (vh - padding * 2) / H,
        maxScale
    );
    canvas.style.width  = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

canvas.style.boxShadow = '0 0 60px rgba(255,120,0,0.5)';
canvas.style.borderRadius = '8px';

// roundRect polyfill (Chrome < 99, Firefox < 112)
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Array.isArray(r) ? r[0] : (r || 0);
        r = Math.min(r, Math.min(w, h) / 2);
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.arcTo(x + w, y,     x + w, y + r,     r);
        this.lineTo(x + w, y + h - r);
        this.arcTo(x + w, y + h, x + w - r, y + h, r);
        this.lineTo(x + r,  y + h);
        this.arcTo(x,       y + h, x, y + h - r,   r);
        this.lineTo(x,      y + r);
        this.arcTo(x,       y,     x + r, y,        r);
        this.closePath();
    };
}

// ============================================================
//  CONSTANTS
// ============================================================
const ROAD_L  = 90;
const ROAD_R  = 390;
const ROAD_W  = ROAD_R - ROAD_L;
const LANES   = 3;
const LANE_W  = ROAD_W / LANES;
const LANE_CX = [0,1,2].map(i => ROAD_L + i * LANE_W + LANE_W / 2);

// Palette ennemis : on réutilise le même COLOR_POOL que les choix joueur.
// La famille du joueur est exclue automatiquement (cf. bannedEnemyFamily ci-dessous).
const ENEMY_COLORS = COLOR_POOL;

// Famille interdite mise à jour quand le joueur choisit son avion
let bannedEnemyFamily = null;

// ============================================================
//  STATE
// ============================================================
const INITIAL_SPEED = 4;
let state    = 'start';   // 'start' | 'playing' | 'paused' | 'gameover'
let score    = 0;
let hiScore  = +(localStorage.getItem('hi') || 0);
let lives    = 3;
let speed    = INITIAL_SPEED;
let frame    = 0;
let shakeT   = 0;

// zone du bouton pause (coordonnees canvas) — CENTRE-HAUT
const PAUSE_BTN = { w: 52, h: 36, get x() { return (W - this.w) / 2; }, y: 6 };

// ============================================================
//  INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
    if (!keys[e.key]) { keys[e.key] = true; onKeyDown(e.key); }
    if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))
        e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function onKeyDown(k) {
    if (state === 'start'    && (k === 'Enter' || k === ' ')) startGame();
    if (state === 'gameover' && (k === 'Enter' || k === ' ')) { state = 'start'; resetDemo(); stopEngine(); }
    if ((state === 'playing' || state === 'paused') && k === ' ') togglePause();
}

// Helper : convertit coordonnées écran -> coordonnées canvas
function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top)  * (H / rect.height),
    };
}

// Helper : test si un point est sur le bouton pause
function isOnPauseButton(cx, cy) {
    return cx >= PAUSE_BTN.x && cx <= PAUSE_BTN.x + PAUSE_BTN.w &&
           cy >= PAUSE_BTN.y && cy <= PAUSE_BTN.y + PAUSE_BTN.h;
}

// === SOURIS (PC) — clic sur le bouton pause + démarrage ===
canvas.addEventListener('mousedown', e => {
    const { x, y } = getCanvasCoords(e.clientX, e.clientY);
    if ((state === 'playing' || state === 'paused') && isOnPauseButton(x, y)) {
        togglePause();
        return;
    }
    // En pause, un clic n'importe où (hors bouton pause déjà géré) reprend le jeu
    if (state === 'paused') {
        togglePause();
        return;
    }
    if (state === 'start' || state === 'gameover') onKeyDown('Enter');
});

// Curseur "pointer" — sur le bouton pause OU partout en pause (l'écran entier reprend le jeu)
canvas.addEventListener('mousemove', e => {
    if (state === 'paused') {
        canvas.style.cursor = 'pointer';
        return;
    }
    if (state !== 'playing') {
        canvas.style.cursor = 'default';
        return;
    }
    const { x, y } = getCanvasCoords(e.clientX, e.clientY);
    canvas.style.cursor = isOnPauseButton(x, y) ? 'pointer' : 'default';
});

// === TACTILE (mobile / tablette) ===
let touchX0 = 0;
let touchStartedOnPause = false;
canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    const { x: cx, y: cy } = getCanvasCoords(t.clientX, t.clientY);

    // tap sur le bouton pause ?
    if ((state === 'playing' || state === 'paused') && isOnPauseButton(cx, cy)) {
        togglePause();
        touchStartedOnPause = true;
        e.preventDefault();
        return;
    }
    // En pause, un tap n'importe où reprend le jeu
    if (state === 'paused') {
        togglePause();
        touchStartedOnPause = true;  // ignore le drag suivant — on vient juste de reprendre
        e.preventDefault();
        return;
    }
    touchStartedOnPause = false;
    touchX0 = t.clientX;
    if (state === 'start' || state === 'gameover') onKeyDown('Enter');
    e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    if (state !== 'playing' || touchStartedOnPause) return;
    // Le déplacement utilise la taille réelle du canvas pour un drag naturel
    const rect = canvas.getBoundingClientRect();
    const ratio = W / rect.width;
    const dx = (e.touches[0].clientX - touchX0) * ratio;
    player.targetX = clamp(player.targetX + dx * 1.5, ROAD_L + 22, ROAD_R - 22);
    touchX0 = e.touches[0].clientX;
    e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => {
    touchStartedOnPause = false;
    e.preventDefault();
}, { passive: false });

// ============================================================
//  HELPERS
// ============================================================
const clamp  = (v, a, b) => Math.min(b, Math.max(a, v));
const rnd    = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b));

// ============================================================
//  NUAGES (remplace les arbres de bord de route)
// ============================================================
const clouds = [];
for (let i = 0; i < 9; i++) {
    clouds.push({
        x: rnd(20, W - 20),
        y: rnd(-100, H),
        s: rnd(0.7, 1.4),
        // les gros nuages défilent un peu plus vite (parallaxe inversée : grands = près)
        speedMult: rnd(0.4, 1.0),
    });
}

function updateClouds() {
    clouds.forEach(c => {
        c.y += speed * c.speedMult;
        if (c.y > H + 80) {
            c.y = -90;
            c.x = rnd(20, W - 20);
            c.s = rnd(0.7, 1.4);
            c.speedMult = rnd(0.4, 1.0);
        }
    });
}

function drawCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    // Ombre douce du nuage
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.ellipse(2, 18, 32, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // Corps du nuage : 4 cercles superposés
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(-18,  4, 14, 0, Math.PI*2);
    ctx.arc( -2, -6, 18, 0, Math.PI*2);
    ctx.arc( 14,  0, 15, 0, Math.PI*2);
    ctx.arc( 22,  8, 11, 0, Math.PI*2);
    ctx.fill();
    // Reflet supérieur
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(-2, -10, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
}

// ============================================================
//  PLAYER
// ============================================================
const player = {
    x: W/2, targetX: W/2, y: H - 130,
    w: 36,  h: 64,
    color: '#E53935', accent: '#FFCDD2',
    spd: 8, invincible: 0,
    trail: [],
};

function updatePlayer() {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.targetX -= player.spd;
    if (keys['ArrowRight']|| keys['d'] || keys['D']) player.targetX += player.spd;
    player.targetX = clamp(player.targetX, ROAD_L + player.w/2 + 4, ROAD_R - player.w/2 - 4);
    player.x += (player.targetX - player.x) * 0.22;
    if (player.invincible > 0) player.invincible--;

    player.trail.push({
        x: player.x + rnd(-5, 5),
        y: player.y + player.h / 2 - 4,
        life: 1, size: rnd(3, 7),
    });
    if (player.trail.length > 18) player.trail.shift();
}

function drawExhaust() {
    player.trail.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life * 0.55;
        // Trainée blanche de condensation, légèrement bleutée
        ctx.fillStyle = '#F5F9FF';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        p.life -= 0.07; // s'estompe un peu plus lentement (trainée plus longue)
    });
    player.trail = player.trail.filter(p => p.life > 0);
}

// ============================================================
//  ENEMIES
// ============================================================
const enemies = [];
let enemyTimer    = 80;
let lastEnemyLane = -1;

function spawnEnemy() {
    let lane;
    do { lane = rndInt(0, LANES); } while (lane === lastEnemyLane && Math.random() < 0.65);
    lastEnemyLane = lane;

    // filtre: exclure la famille de couleur choisie par le joueur
    const available = ENEMY_COLORS.filter(c => c.family !== bannedEnemyFamily);
    const pick = available[rndInt(0, available.length)];

    enemies.push({
        x: LANE_CX[lane], y: -80,
        w: 34, h: 60,
        color:  pick.color,
        accent: pick.accent,
        spd: rnd(0.5, 2.8),
    });
}

function updateEnemies() {
    enemyTimer--;
    if (enemyTimer <= 0) {
        spawnEnemy();
        enemyTimer = Math.max(28, 90 - Math.floor(score / 350) * 5);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].y += speed + enemies[i].spd;
        if (enemies[i].y > H + 90) {
            enemies.splice(i, 1);
            score += 5;
            playDodge();
        }
    }
}

// ============================================================
//  PARTICLES
// ============================================================
const particles = [];

function spawnParticles(x, y) {
    for (let i = 0; i < 28; i++) {
        const a = rnd(0, Math.PI * 2), v = rnd(2, 9);
        particles.push({
            x, y,
            vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3,
            life: 1, decay: rnd(0.02, 0.05),
            size: rnd(3, 9),
            hue: rnd(10, 60),
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.18;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = `hsl(${p.hue},100%,60%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

// ============================================================
//  COLLISION
// ============================================================
function checkCollisions() {
    if (player.invincible > 0) return;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (Math.abs(player.x - e.x) < (player.w + e.w)/2 - 7 &&
            Math.abs(player.y - e.y) < (player.h + e.h)/2 - 9) {

            spawnParticles((player.x + e.x)/2, (player.y + e.y)/2);
            enemies.splice(i, 1);
            lives--;
            player.invincible = 150;
            shakeT = 25;
            playCollision();
            if (lives <= 0) {
                state = 'gameover';
                stopEngine();
                speed = INITIAL_SPEED;
                if (score > hiScore) {
                    hiScore = score;
                    localStorage.setItem('hi', hiScore);
                    playRecord();
                } else {
                    playGameOver();
                }
            }
            return;
        }
    }
}

// ============================================================
//  DRAW PLANE (avion vu de dessus)
//  flip=false -> joueur (nez vers le haut)
//  flip=true  -> ennemi  (nez vers le bas)
// ============================================================
function drawCar(x, y, w, h, color, accent, flip) {
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(1, -1);

    // Ombre portée (ovale sous l'avion)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(2, h/2 + 4, w/2 + 4, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // === AILES (croix) — le plus large ===
    // Ailes principales : larges, légèrement reculées par rapport au nez
    ctx.fillStyle = color;
    ctx.beginPath();
    // forme trapézoïdale des ailes
    const wingY = -h * 0.05;  // hauteur des ailes (légèrement en arrière du milieu)
    const wingSpan = w * 1.7;
    const wingDepth = h * 0.32;
    ctx.moveTo(-wingSpan/2, wingY);
    ctx.lineTo( wingSpan/2, wingY);
    ctx.lineTo( w/2 + 2,    wingY + wingDepth);
    ctx.lineTo(-w/2 - 2,    wingY + wingDepth);
    ctx.closePath();
    ctx.fill();
    // Liseré clair au bord d'attaque des ailes
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-wingSpan/2, wingY, wingSpan, 3);

    // === STABILISATEUR ARRIERE (petites ailes en T) ===
    ctx.fillStyle = color;
    const tailY = h/2 - h*0.16;
    const tailSpan = w * 0.95;
    ctx.beginPath();
    ctx.moveTo(-tailSpan/2, tailY);
    ctx.lineTo( tailSpan/2, tailY);
    ctx.lineTo( w/2 - 2,    tailY + h*0.16);
    ctx.lineTo(-w/2 + 2,    tailY + h*0.16);
    ctx.closePath();
    ctx.fill();

    // === FUSELAGE (corps central) ===
    ctx.fillStyle = color;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, [w/2, w/2, w*0.35, w*0.35]);
    else ctx.rect(-w/2, -h/2, w, h);
    ctx.fill();

    // Reflet le long du fuselage (effet métallique)
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2 + 3, -h/2 + 4, 6, h - 12, 3);
    else ctx.rect(-w/2 + 3, -h/2 + 4, 6, h - 12);
    ctx.fill();

    // === COCKPIT (verrière) ===
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2 + 6, -h/2 + 8, w - 12, h * 0.32, [6, 6, 4, 4]);
    else ctx.rect(-w/2 + 6, -h/2 + 8, w - 12, h * 0.32);
    ctx.fill();
    // Cadre du cockpit
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -h/2 + 8); ctx.lineTo(0, -h/2 + 8 + h*0.32);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // === DERIVE (aileron vertical) sur le fuselage arrière ===
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,    h/2 - 4);
    ctx.lineTo(-3,   h/2 - h*0.18);
    ctx.lineTo( 3,   h/2 - h*0.18);
    ctx.closePath();
    ctx.fill();
    // ombre dérive
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.moveTo(0,  h/2 - 4);
    ctx.lineTo(0,  h/2 - h*0.18);
    ctx.lineTo(3,  h/2 - h*0.18);
    ctx.closePath();
    ctx.fill();

    // === NEZ + HELICE qui tourne ===
    // Disque du nez
    ctx.fillStyle = '#263238';
    ctx.beginPath();
    ctx.arc(0, -h/2 + 1, 5, 0, Math.PI*2);
    ctx.fill();
    // Pales (rotation rapide via frame)
    const propAngle = (frame * 0.9) % (Math.PI * 2);
    ctx.save();
    ctx.translate(0, -h/2);
    ctx.rotate(propAngle);
    ctx.fillStyle = 'rgba(50,50,50,0.55)';
    // 2 pales
    ctx.fillRect(-w/2 - 4, -1.5, w + 8, 3);
    ctx.restore();
    // Cercle flou (illusion de rotation)
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -h/2, w/2 + 2, 0, Math.PI*2);
    ctx.stroke();

    // === FEUX DE NAVIGATION sur les bouts d'aile ===
    // rouge à gauche, vert à droite (convention aéronautique)
    ctx.fillStyle = '#FF1744';
    ctx.beginPath();
    ctx.arc(-wingSpan/2 + 2, wingY + wingDepth/2, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#00E676';
    ctx.beginPath();
    ctx.arc( wingSpan/2 - 2, wingY + wingDepth/2, 2.5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

// Version "preview" pour la modale (dessine un avion plus petit)
function drawPlaneOnCtx(c, x, y, w, h, color, accent) {
    c.save(); c.translate(x, y);

    // Ombre
    c.fillStyle = 'rgba(0,0,0,0.2)';
    c.beginPath();
    c.ellipse(2, h/2 + 5, w/2 + 4, 4, 0, 0, Math.PI*2);
    c.fill();

    // Ailes principales
    c.fillStyle = color;
    const wingY = -h * 0.05;
    const wingSpan = w * 1.7;
    const wingDepth = h * 0.32;
    c.beginPath();
    c.moveTo(-wingSpan/2, wingY);
    c.lineTo( wingSpan/2, wingY);
    c.lineTo( w/2 + 2,    wingY + wingDepth);
    c.lineTo(-w/2 - 2,    wingY + wingDepth);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.fillRect(-wingSpan/2, wingY, wingSpan, 2);

    // Stabilisateur arrière
    c.fillStyle = color;
    const tailY = h/2 - h*0.16;
    const tailSpan = w * 0.95;
    c.beginPath();
    c.moveTo(-tailSpan/2, tailY);
    c.lineTo( tailSpan/2, tailY);
    c.lineTo( w/2 - 2,    tailY + h*0.16);
    c.lineTo(-w/2 + 2,    tailY + h*0.16);
    c.closePath();
    c.fill();

    // Fuselage
    c.fillStyle = color;
    c.beginPath();
    if (c.roundRect) c.roundRect(-w/2, -h/2, w, h, [w/2, w/2, w*0.35, w*0.35]);
    else c.rect(-w/2, -h/2, w, h);
    c.fill();

    // Reflet
    c.fillStyle = 'rgba(255,255,255,0.22)';
    c.beginPath();
    if (c.roundRect) c.roundRect(-w/2 + 3, -h/2 + 4, 5, h - 12, 3);
    else c.rect(-w/2 + 3, -h/2 + 4, 5, h - 12);
    c.fill();

    // Cockpit
    c.fillStyle = accent; c.globalAlpha = 0.9;
    c.beginPath();
    if (c.roundRect) c.roundRect(-w/2 + 5, -h/2 + 8, w - 10, h * 0.32, 5);
    else c.rect(-w/2 + 5, -h/2 + 8, w - 10, h * 0.32);
    c.fill();
    c.globalAlpha = 1;

    // Nez
    c.fillStyle = '#263238';
    c.beginPath(); c.arc(0, -h/2 + 1, 5, 0, Math.PI*2); c.fill();
    // Hélice statique pour preview
    c.fillStyle = 'rgba(50,50,50,0.55)';
    c.fillRect(-w/2 - 4, -h/2 - 1.5, w + 8, 3);

    // Feux de navigation
    c.fillStyle = '#FF1744';
    c.beginPath(); c.arc(-wingSpan/2 + 2, wingY + wingDepth/2, 2, 0, Math.PI*2); c.fill();
    c.fillStyle = '#00E676';
    c.beginPath(); c.arc( wingSpan/2 - 2, wingY + wingDepth/2, 2, 0, Math.PI*2); c.fill();

    c.restore();
}

// ============================================================
//  DECOR CIEL
// ============================================================
function drawScene() {
    // Ciel : dégradé bleu profond → bleu clair (haut vers bas)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#1976D2');  // haut : bleu profond
    g.addColorStop(0.55, '#42A5F5');  // milieu
    g.addColorStop(1,    '#90CAF9');  // bas : bleu clair
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Soleil discret en haut à droite
    ctx.save();
    const sunX = W - 60, sunY = 70;
    const sg = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 60);
    sg.addColorStop(0, 'rgba(255,255,200,0.85)');
    sg.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sunX, sunY, 60, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,210,0.95)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 18, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Bords du couloir aérien — délimitations très discrètes (lignes de vol)
    // pour donner une zone de jeu lisible sans casser l'immersion ciel.
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 14]);
    ctx.lineDashOffset = -(score % 20);
    ctx.beginPath(); ctx.moveTo(ROAD_L, 0); ctx.lineTo(ROAD_L, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ROAD_R, 0); ctx.lineTo(ROAD_R, H); ctx.stroke();
    ctx.setLineDash([]);
}

// ============================================================
//  PAUSE
// ============================================================
function togglePause() {
    state = state === 'playing' ? 'paused' : 'playing';
    if (audioCtx) {
        const t = audioCtx.currentTime;
        if (state === 'paused') {
            // Couper tout le moteur (souffle + hélice)
            if (engineGain) engineGain.gain.setTargetAtTime(0, t, 0.05);
            if (propGain)   propGain.gain.setTargetAtTime(0, t, 0.05);
        } else {
            // Restaurer aux valeurs cohérentes avec la vitesse actuelle
            if (engineGain) engineGain.gain.setTargetAtTime(0.12 + (speed - 4) * 0.008, t, 0.05);
            if (propGain)   propGain.gain.setTargetAtTime(0.05, t, 0.05);
        }
    }
}

function drawPauseButton(isPaused) {
    const { x, y, w, h } = PAUSE_BTN;
    ctx.save();
    ctx.fillStyle = isPaused ? 'rgba(255,152,0,0.92)' : 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = isPaused ? '#FFB300' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.stroke();
    ctx.fillStyle = '#FFF';
    if (isPaused) {
        // triangle play (centré)
        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy - 9);
        ctx.lineTo(cx - 6, cy + 9);
        ctx.lineTo(cx + 9, cy);
        ctx.closePath(); ctx.fill();
    } else {
        // deux barres (centrées)
        const cx = x + w / 2;
        ctx.fillRect(cx - 9, y + 8, 6, h - 16);
        ctx.fillRect(cx + 3, y + 8, 6, h - 16);
    }
    ctx.restore();
}

function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,152,0,0.92)';
    ctx.beginPath(); ctx.roundRect(W/2 - 140, H/2 - 72, 280, 58, 14); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 50px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSE', W/2, H/2 - 22);

    ctx.fillStyle = '#EEE';
    ctx.font = '18px Arial';
    ctx.fillText('Clique ou touche l\u2019\u00e9cran pour reprendre', W/2, H/2 + 30);
    ctx.fillStyle = '#BBB';
    ctx.font = '15px Arial';
    ctx.fillText('Ou appuie sur ESPACE', W/2, H/2 + 60);
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
    const g = ctx.createLinearGradient(0, 0, 0, 95);
    g.addColorStop(0, 'rgba(0,0,0,0.72)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 95);

    // bouton pause (CENTRE-HAUT)
    drawPauseButton(state === 'paused');

    // score (a gauche)
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(score, 14, 36);
    ctx.fillStyle = '#AAA';
    ctx.font = '13px Arial';
    ctx.fillText('SCORE', 14, 54);

    // vitesse (a droite) — calibrée pour un petit avion (200-400 km/h)
    const kmh = Math.floor(speed * 50);
    ctx.textAlign = 'right';
    ctx.fillStyle = speed >= 7 ? '#FF5722' : '#FF9800';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(kmh, W - 14, 36);
    ctx.fillStyle = '#AAA';
    ctx.font = '13px Arial';
    ctx.fillText('KM/H', W - 14, 54);

    // meilleur score (juste sous le bouton pause, centré)
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 13px Arial';
    ctx.fillText('MEILLEUR: ' + hiScore, W/2, 58);

    // vies (en bas du bandeau, centrées)
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < lives ? '#E53935' : '#555';
        ctx.fillText('\u2665', W/2 - 24 + i * 24, 84);
    }
}

// ============================================================
//  ECRAN DEBUT
// ============================================================
function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(0, 0, W, H);

    // ===== LOGO ZOWOKIDS en haut =====
    if (logoLoaded) {
        const targetW = 280;
        const ratio = LOGO_IMG.height / LOGO_IMG.width;
        const targetH = targetW * ratio;
        // léger flottement vertical pour donner vie
        const bob = Math.sin(Date.now() / 600) * 3;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        ctx.drawImage(LOGO_IMG, (W - targetW) / 2, 30 + bob, targetW, targetH);
        ctx.restore();
    } else {
        // fallback texte si l'image n'est pas encore chargée
        ctx.fillStyle = '#FFD54F';
        ctx.font = 'bold 38px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ZOWOKIDS', W/2, 70);
    }

    // ===== Titre COURSE D'AVION =====
    ctx.fillStyle = '#0D47A1';
    ctx.beginPath(); ctx.roundRect(55, 215, W-110, 78, 14); ctx.fill();
    ctx.fillStyle = '#1976D2';
    ctx.beginPath(); ctx.roundRect(55, 215, W-110, 62, 14); ctx.fill();

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("COURSE D'AVION", W/2, 262);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 17px Arial';
    ctx.fillText('Evite les avions adverses !', W/2, 317);

    // ===== Bloc instructions =====
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.roundRect(70, 332, W-140, 112, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(70, 332, W-140, 112, 12); ctx.stroke();

    ctx.fillStyle = '#EEE';
    ctx.font = '15px Arial';
    ctx.fillText('Clavier : \u2190 \u2192  ou  A / D', W/2, 356);
    ctx.fillStyle = '#CCC';
    ctx.font = '14px Arial';
    ctx.fillText('Mobile : Glisser le doigt', W/2, 378);
    ctx.fillText('3 vies  \u2022  Vitesse croissante', W/2, 400);
    ctx.fillStyle = '#FF9800';
    ctx.font = '13px Arial';
    ctx.fillText('Pause : ESPACE  |  Mobile : bouton \u23F8 (haut centre)', W/2, 430);

    // ===== Appel à l'action clignotant =====
    if (Date.now() % 1100 < 750) {
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('ENTREE  ou  ESPACE  pour decoller', W/2, 482);
    }

    if (hiScore > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 17px Arial';
        ctx.fillText('Record: ' + hiScore, W/2, 512);
    }
}

// ============================================================
//  ECRAN GAME OVER
// ============================================================
function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#B71C1C';
    ctx.beginPath(); ctx.roundRect(55, 195, W-110, 82, 14); ctx.fill();
    ctx.fillStyle = '#E53935';
    ctx.beginPath(); ctx.roundRect(55, 195, W-110, 62, 14); ctx.fill();

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 54px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💥 CRASH !', W/2, 250);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 32px Arial';
    ctx.fillText('Score : ' + score, W/2, 322);

    if (score > 0 && score >= hiScore) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 22px Arial';
        ctx.fillText('Nouveau Record !', W/2, 362);
    }

    ctx.fillStyle = '#FFD700';
    ctx.font = '20px Arial';
    ctx.fillText('Meilleur : ' + hiScore, W/2, 398);

    ctx.fillStyle = '#FF8A65';
    ctx.font = '17px Arial';
    // Vitesse en km/h adaptée à un petit avion (≈ 200 + accélération)
    const maxSpd = Math.floor((INITIAL_SPEED + Math.floor(score / 400) * 0.4) * 50);
    ctx.fillText('Vitesse de pointe : ' + maxSpd + ' km/h', W/2, 430);

    if (Date.now() % 1100 < 750) {
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('ENTREE pour redécoller', W/2, 488);
    }
}

// ============================================================
//  CONTROLE DU JEU
// ============================================================
function startGame() {
    state = 'playing';
    score = 0; lives = 3; speed = INITIAL_SPEED; frame = 0;
    player.x = player.targetX = W / 2;
    player.invincible = 0;
    player.trail = [];
    enemies.length = 0;
    particles.length = 0;
    enemyTimer = 80;
    lastEnemyLane = -1;
    playStart();
    startEngine();
}

function resetDemo() {
    enemies.length = 0;
    enemyTimer = 80;
    lastEnemyLane = -1;
    speed = INITIAL_SPEED;
    score = 0;
}

// ============================================================
//  BOUCLE PRINCIPALE
// ============================================================
function loop() {
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = rnd(-6, 6); sy = rnd(-6, 6); shakeT--; }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.clearRect(-10, -10, W+20, H+20);

    drawScene();
    clouds.forEach(c => drawCloud(c.x, c.y, c.s));

    if (state === 'playing') {
        frame++;
        speed = INITIAL_SPEED + Math.floor(score / 400) * 0.4;
        setEngineSpeed(speed);
        updateClouds();
        updatePlayer();
        updateEnemies();
        updateParticles();
        checkCollisions();

        drawExhaust();
        enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, e.accent, true));

        if (player.invincible === 0 || Math.floor(player.invincible / 10) % 2 === 0)
            drawCar(player.x, player.y, player.w, player.h, player.color, player.accent, false);

        drawParticles();
        drawHUD();
        score++;

    } else if (state === 'start') {
        frame++;
        updateClouds();
        drawStartScreen();

    } else if (state === 'paused') {
        // afficher le jeu figé sans mettre à jour la logique
        drawExhaust();
        enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, e.accent, true));
        drawCar(player.x, player.y, player.w, player.h, player.color, player.accent, false);
        drawParticles();
        drawHUD();
        drawPauseOverlay();

    } else if (state === 'gameover') {
        updateParticles();
        drawParticles();
        drawGameOverScreen();
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// loop started by the color-picker modal button above
</script>
