<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zowo Kids — Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --c-sky:#5BC0EB;
    --c-sky-deep:#2E9CCA;
    --c-sun:#FFD23F;
    --c-sun-deep:#F4A300;
    --c-coral:#FF6B6B;
    --c-coral-deep:#E63946;
    --c-grass:#06D6A0;
    --c-grass-deep:#06A77D;
    --c-grape:#9B5DE5;
    --c-grape-deep:#7B2CBF;
    --c-cream:#FFF8E7;
    --c-ink:#2B2D42;
    --c-paper:#FFFDF6;
    --shadow-pop: 0 6px 0 rgba(0,0,0,0.18), 0 12px 24px rgba(43,45,66,0.18);
    --shadow-soft: 0 4px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(43,45,66,0.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow-x:hidden;}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    color:var(--c-ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,210,63,0.35) 0%, transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(255,107,107,0.30) 0%, transparent 35%),
      radial-gradient(circle at 75% 85%, rgba(155,93,229,0.30) 0%, transparent 35%),
      radial-gradient(circle at 20% 80%, rgba(6,214,160,0.30) 0%, transparent 40%),
      linear-gradient(180deg, #DFF6FF 0%, #FFE9F1 100%);
    min-height:100vh;
    position:relative;
  }

  /* Top-left small logo (visible on home + game) */
  .corner-logo{
    position:fixed;
    top:14px; left:14px;
    z-index:30;
    width:clamp(95px, 14vw, 160px);
    height:auto;
    filter: drop-shadow(0 4px 10px rgba(43,45,66,0.3));
    transition: transform .25s ease;
    cursor:pointer;
    animation: bob 3.5s ease-in-out infinite;
  }
  .corner-logo:hover{transform:scale(1.05);}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-4px) rotate(1deg);}
  }

  /* Floating decorative bubbles */
  .bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bubble{
    position:absolute;border-radius:50%;
    opacity:.45;
    animation: float 12s ease-in-out infinite;
  }
  .bubble:nth-child(1){width:80px;height:80px;background:var(--c-sun);top:10%;left:5%;animation-delay:0s;}
  .bubble:nth-child(2){width:50px;height:50px;background:var(--c-coral);top:30%;left:90%;animation-delay:2s;}
  .bubble:nth-child(3){width:120px;height:120px;background:var(--c-grape);top:70%;left:8%;animation-delay:4s;}
  .bubble:nth-child(4){width:60px;height:60px;background:var(--c-grass);top:80%;left:85%;animation-delay:1s;}
  .bubble:nth-child(5){width:40px;height:40px;background:var(--c-sky);top:50%;left:50%;animation-delay:3s;}
  .bubble:nth-child(6){width:90px;height:90px;background:var(--c-sun);top:5%;left:60%;animation-delay:5s;}

  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-30px) rotate(20deg);}
  }

  .screen{
    min-height:100vh;
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }
  .screen.active{display:flex;animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ============== HOME (fills entire viewport) ============== */
  #home{
    justify-content:center;
    padding: 90px 16px 24px;
    min-height:100vh;
    min-height:100dvh;
  }

  .home-inner{
    width:100%;
    max-width:1100px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(14px, 2.5vh, 28px);
    flex:1;
  }

  .tagline{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(28px, 5.5vw, 52px);
    text-align:center;
    letter-spacing:.5px;
    line-height:1.1;
  }
  .tagline span{
    background: linear-gradient(135deg, var(--c-coral), var(--c-grape));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{
    font-size:clamp(15px, 2vw, 22px);
    color:#5a5e7a;
    font-weight:500;
    text-align:center;
    max-width:600px;
  }

  .difficulty-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap: clamp(12px, 2vw, 26px);
    width:100%;
    max-width:1000px;
  }

  .diff-card{
    cursor:pointer;
    border:none;
    background:var(--c-paper);
    border-radius:28px;
    padding: clamp(18px, 3vw, 32px) clamp(14px, 2vw, 22px);
    box-shadow:var(--shadow-pop);
    transition: transform .2s ease, box-shadow .2s ease;
    position:relative;
    overflow:hidden;
    text-align:center;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .diff-card::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.04) 100%);
    pointer-events:none;
  }
  .diff-card:hover{transform:translateY(-4px) rotate(-1deg);}
  .diff-card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.18), 0 4px 8px rgba(43,45,66,0.18);}
  .diff-card .badge{
    width: clamp(70px, 10vw, 100px);
    height: clamp(70px, 10vw, 100px);
    margin: 0 auto clamp(10px, 1.5vw, 16px);
    border-radius:24px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(22px, 3vw, 34px);
    color:white;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 4px 0 rgba(0,0,0,0.12);
    transform:rotate(-4deg);
  }
  .diff-card.easy .badge{background:var(--c-grass);}
  .diff-card.med  .badge{background:var(--c-sun);color:#7a4a00;}
  .diff-card.hard .badge{background:var(--c-coral);}
  .diff-card h3{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(20px, 2.5vw, 28px);
    margin-bottom:6px;
  }
  .diff-card.easy h3{color:var(--c-grass-deep);}
  .diff-card.med  h3{color:var(--c-sun-deep);}
  .diff-card.hard h3{color:var(--c-coral-deep);}
  .diff-card p{
    font-size:clamp(13px, 1.4vw, 16px);
    color:#5a5e7a;
    line-height:1.4;
  }
  .diff-card .age{
    margin-top:clamp(8px, 1.2vw, 14px);
    display:inline-block;
    padding:4px 12px;
    background:rgba(43,45,66,0.08);
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#5a5e7a;
  }

  /* ============== GAME ============== */
  #game{
    padding: 14px 14px 14px 14px;
    padding-top: clamp(14px, 2vw, 22px);
    justify-content:flex-start;
    align-items:center;
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    max-height: 100dvh;
    overflow: hidden;
  }
  .game-header{
    width: 100%;
    max-width: 1200px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-bottom: clamp(8px, 1.5vw, 14px);
    flex-wrap:wrap;
    padding-left: clamp(110px, 16vw, 180px); /* leave room for logo */
  }
  /* Main play area: side-by-side on desktop, stacked on mobile */
  .play-area{
    display:flex;
    flex-direction: row;
    align-items:center;
    justify-content:center;
    gap: clamp(16px, 3vw, 40px);
    width:100%;
    max-width: 1200px;
    flex: 1;
    min-height: 0; /* important for flex children */
  }
  .btn{
    border:none;
    cursor:pointer;
    font-family:"Baloo 2",cursive;
    font-weight:700;
    font-size:clamp(13px, 1.5vw, 16px);
    padding: clamp(9px, 1.2vw, 12px) clamp(14px, 1.8vw, 22px);
    border-radius:14px;
    color:white;
    box-shadow:var(--shadow-soft);
    transition: transform .15s ease, box-shadow .15s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  .btn-back{background:var(--c-grape);}
  .btn-check{background:var(--c-grass);}
  .btn-clear{background:var(--c-coral);}
  .btn-primary{background:var(--c-sky-deep);}
  .btn-sound{
    background: var(--c-sun);
    color: #7a4a00;
    width:44px;
    height:44px;
    padding:0;
    justify-content:center;
    font-size:18px;
  }
  .btn-home{
    width:44px;
    height:44px;
    padding:0;
    justify-content:center;
    font-size:22px;
  }

  .level-pill{
    background:var(--c-paper);
    padding:10px 18px;
    border-radius:999px;
    font-family:"Baloo 2",cursive;
    font-weight:800;
    font-size:clamp(15px, 1.8vw, 18px);
    color:var(--c-ink);
    box-shadow:var(--shadow-soft);
  }

  .board-frame{
    background:var(--c-paper);
    padding: clamp(8px, 1.5vw, 14px);
    border-radius:24px;
    box-shadow:var(--shadow-pop);
    position:relative;
  }

  .board{
    display:grid;
    gap:0;
    background:var(--c-ink);
    border-radius:14px;
    overflow:hidden;
    border:4px solid var(--c-ink);
  }

  .cell{
    background:var(--c-cream);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Baloo 2",cursive;
    font-weight:800;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
    user-select:none;
    position:relative;
    border:1px solid #e8dfc4;
  }
  .cell.fixed{
    background:#FFF1C4;
    color:var(--c-ink);
    cursor:default;
  }
  .cell.user{color:var(--c-sky-deep);}
  .cell.selected{background:#FFE08A!important;transform:scale(1.02);z-index:2;}
  .cell.same-num{background:#FFEFC8;}
  .cell.error{
    background:#FFD0D0!important;
    color:var(--c-coral-deep)!important;
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .cell.b-right{border-right:3px solid var(--c-ink);}
  .cell.b-bottom{border-bottom:3px solid var(--c-ink);}

  .number-pad{
    display:grid;
    gap:8px;
    /* desktop default: compact vertical/grid layout next to board */
  }
  .number-pad button{
    border:none;
    cursor:pointer;
    background:var(--c-paper);
    border-radius:14px;
    font-family:"Baloo 2",cursive;
    font-weight:800;
    color:var(--c-ink);
    box-shadow:var(--shadow-soft);
    transition:transform .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .number-pad button:hover{transform:translateY(-2px);background:#FFF1C4;}
  .number-pad button:active{transform:translateY(2px);}
  .number-pad button.erase{background:var(--c-coral);color:white;}

  /* ============== OVERLAYS ============== */
  .overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:80;
    padding:20px;
  }
  .overlay.active{display:flex;animation:fadeIn .3s ease;}
  .overlay-bg{
    position:absolute;inset:0;
    background:rgba(20,22,40,0.6);
    backdrop-filter:blur(6px);
  }
  .modal{
    position:relative;
    background:var(--c-paper);
    border-radius:32px;
    padding: clamp(24px, 4vw, 36px) clamp(20px, 3vw, 28px) clamp(20px, 3vw, 28px);
    text-align:center;
    width:min(100%, 460px);
    box-shadow:var(--shadow-pop);
    animation:pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emoji{font-size:clamp(48px, 8vw, 64px);margin-bottom:8px;display:inline-block;animation:wiggle 1s ease infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .modal h2{
    font-family:"Baloo 2",cursive;
    font-weight:800;
    font-size:clamp(24px, 3.5vw, 32px);
    margin-bottom:8px;
  }
  .modal.fail h2{color:var(--c-coral-deep);}
  .modal p{color:#5a5e7a;margin-bottom:22px;font-size:clamp(14px, 1.6vw, 16px);line-height:1.5;}
  .modal .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

  /* ============== FIREWORKS ============== */
  /* Transparent canvas overlaying the entire game screen */
  #fireworks-canvas{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:70;
    display:none;
    background:transparent;
  }
  #fireworks-canvas.active{
    display:block;
    pointer-events:auto;  /* listen for tap to dismiss */
    cursor:pointer;
  }

  /* Win banner above fireworks (no dark background) */
  .win-banner{
    position:fixed;
    top: 50%;
    left:50%;
    transform: translate(-50%, -50%) scale(0);
    z-index:75;
    pointer-events:none;
    background: linear-gradient(135deg, var(--c-sun), var(--c-coral));
    color:white;
    padding: clamp(18px, 3vw, 28px) clamp(28px, 5vw, 48px);
    border-radius:28px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.18), 0 16px 30px rgba(43,45,66,0.3);
    font-family:"Baloo 2",cursive;
    font-weight:800;
    text-align:center;
    border: 5px solid white;
    animation: bannerIn .6s cubic-bezier(.34,1.56,.64,1) forwards, bannerWiggle 2s ease-in-out 0.7s infinite;
    display:none;
  }
  .win-banner.active{display:block;}
  .win-banner .big{
    font-size: clamp(32px, 6vw, 56px);
    line-height:1;
    margin-bottom:6px;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
  }
  .win-banner .small{
    font-size: clamp(13px, 1.6vw, 17px);
    font-weight:600;
    opacity:.95;
  }
  @keyframes bannerIn{
    from{transform: translate(-50%, -50%) scale(0) rotate(-15deg);}
    to{transform: translate(-50%, -50%) scale(1) rotate(0);}
  }
  @keyframes bannerWiggle{
    0%,100%{transform: translate(-50%, -50%) rotate(-2deg);}
    50%{transform: translate(-50%, -50%) rotate(2deg);}
  }

  /* ============== RESPONSIVE ============== */
  /* Tablet */
  @media (max-width: 900px){
    .difficulty-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }
  }
  /* Small tablet / large phone */
  @media (max-width: 680px){
    .difficulty-grid{
      grid-template-columns:1fr;
      max-width:380px;
      gap:14px;
    }
    .diff-card{
      flex-direction:row;
      text-align:left;
      padding:14px 18px;
      gap:14px;
    }
    .diff-card .badge{
      width:62px;height:62px;
      margin:0;
      font-size:22px;
      flex-shrink:0;
    }
    .diff-card-text{flex:1;}
    .diff-card h3{margin-bottom:2px;}
    .diff-card p{font-size:13px;}
    .corner-logo{width:90px;}
    #home{padding-top:90px;}
    #game{padding:80px 10px 24px;}
  }
  /* Tablet portrait & smaller — stack pad below the board */
  @media (max-width: 820px){
    .play-area{
      flex-direction: column;
      gap: clamp(6px, 1vw, 12px);
      justify-content:center;
    }
    #game{
      padding-top: 80px; /* room for logo */
      overflow: hidden;
    }
    .game-header{
      padding-left: 0;
      justify-content:center;
    }
  }
  /* Phone */
  @media (max-width: 460px){
    .game-header{
      gap:6px;
    }
    .btn{padding:8px 12px;font-size:13px;}
    .btn-sound{width:38px;height:38px;font-size:16px;}
    .btn-home{width:38px;height:38px;font-size:18px;}
    .level-pill{padding:8px 14px;font-size:14px;}
    .corner-logo{width:75px;top:10px;left:10px;}
    .number-pad{gap:5px;}
  }
  /* Landscape phone — keep side-by-side to save vertical space */
  @media (max-height: 500px) and (orientation: landscape){
    #home{padding:60px 16px 16px;}
    .corner-logo{width:70px;}
    .difficulty-grid{grid-template-columns:repeat(3,1fr);}
    .play-area{flex-direction:row;}
    #game{padding-top: 8px;}
    .corner-logo{width:60px;}
    .game-header{padding-left: 80px;}
  }
</style>
</head>

<script>
/* ==================================================================
   ZOWO KIDS — SUDOKU
   ================================================================== */

const State = {
  size: 9,
  blockRows: 3,
  blockCols: 3,
  solution: [],
  puzzle: [],
  grid: [],
  selected: null,
  soundOn: true,
};

/* ============== AUDIO (Web Audio API — no external files) ============== */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration=0.15, type="sine", volume=0.2, when=0){
  if(!State.soundOn) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
  gain.gain.setValueAtTime(0, ctx.currentTime + when);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + when + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + when + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + when);
  osc.stop(ctx.currentTime + when + duration + 0.05);
}

const Sound = {
  click(){ playTone(600, 0.06, "square", 0.08); },
  place(){ playTone(523, 0.08, "triangle", 0.18); playTone(784, 0.08, "triangle", 0.12, 0.04); },
  erase(){ playTone(300, 0.1, "sawtooth", 0.12); },
  select(){ playTone(880, 0.05, "sine", 0.1); },
  win(){
    // Cheerful ascending arpeggio
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
    notes.forEach((f,i)=> playTone(f, 0.25, "triangle", 0.22, i*0.12));
    // Sparkle
    setTimeout(()=>{
      for(let i=0;i<6;i++) playTone(1500 + Math.random()*1500, 0.1, "sine", 0.08, i*0.08);
    }, 600);
  },
  fail(){
    // Classic "sad trombone" wah-wah-waaaah with vibrato + descending pitch bend
    if(!State.soundOn) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const now = ctx.currentTime;

    // Three "wah" notes, each with a downward pitch bend and vibrato
    const notes = [
      { freq: 380, dur: 0.28, start: 0.00 },
      { freq: 320, dur: 0.30, start: 0.30 },
      { freq: 250, dur: 0.75, start: 0.62 }, // last one is longer + descends further
    ];

    notes.forEach((n, idx) => {
      const t0 = now + n.start;
      // main oscillator (brassy)
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(n.freq, t0);
      // slight downward bend on each note (the "waah")
      osc.frequency.exponentialRampToValueAtTime(n.freq * 0.78, t0 + n.dur);

      // vibrato via LFO
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 6 + idx * 1.5;
      lfoGain.gain.value = n.freq * 0.025;
      lfo.connect(lfoGain).connect(osc.frequency);

      // low-pass filter to soften the sawtooth -> trombone-ish
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1400, t0);
      filter.frequency.exponentialRampToValueAtTime(700, t0 + n.dur);
      filter.Q.value = 2;

      // envelope
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.04);
      gain.gain.setValueAtTime(0.22, t0 + n.dur * 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + n.dur);

      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + n.dur + 0.05);
      lfo.start(t0);
      lfo.stop(t0 + n.dur + 0.05);
    });

    // Final "thud" — a soft low boom at the very end for the disappointment
    const thudStart = now + 1.40;
    const thud = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thud.type = "sine";
    thud.frequency.setValueAtTime(120, thudStart);
    thud.frequency.exponentialRampToValueAtTime(60, thudStart + 0.3);
    thudGain.gain.setValueAtTime(0.25, thudStart);
    thudGain.gain.exponentialRampToValueAtTime(0.001, thudStart + 0.35);
    thud.connect(thudGain).connect(ctx.destination);
    thud.start(thudStart);
    thud.stop(thudStart + 0.4);

    // Subtle "buzz" texture under the trombone for added sad-comedy weight
    const buzzBuffer = ctx.createBuffer(1, ctx.sampleRate * 1.6, ctx.sampleRate);
    const buzzData = buzzBuffer.getChannelData(0);
    for(let i = 0; i < buzzData.length; i++){
      buzzData[i] = (Math.random() * 2 - 1) * 0.3;
    }
    const buzz = ctx.createBufferSource();
    buzz.buffer = buzzBuffer;
    const buzzFilter = ctx.createBiquadFilter();
    buzzFilter.type = "bandpass";
    buzzFilter.frequency.value = 250;
    buzzFilter.Q.value = 4;
    const buzzGain = ctx.createGain();
    buzzGain.gain.setValueAtTime(0, now);
    buzzGain.gain.linearRampToValueAtTime(0.04, now + 0.05);
    buzzGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    buzz.connect(buzzFilter).connect(buzzGain).connect(ctx.destination);
    buzz.start(now);
    buzz.stop(now + 1.6);
  },
  pop(){ playTone(800 + Math.random()*400, 0.08, "sine", 0.15); },
  fireworkBoom(){
    // Realistic firework: WHOOSH (rising) -> BOOM (noise burst) -> CRACKLES (sparkles)
    if(!State.soundOn) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const now = ctx.currentTime;

    // === 1. WHOOSH (rising whistle, 0 - 0.25s) ===
    const whooshOsc = ctx.createOscillator();
    const whooshGain = ctx.createGain();
    whooshOsc.type = "sine";
    whooshOsc.frequency.setValueAtTime(200, now);
    whooshOsc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
    whooshGain.gain.setValueAtTime(0, now);
    whooshGain.gain.linearRampToValueAtTime(0.08, now + 0.05);
    whooshGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    whooshOsc.connect(whooshGain).connect(ctx.destination);
    whooshOsc.start(now);
    whooshOsc.stop(now + 0.3);

    // === 2. BOOM (noise burst with low-pass, 0.25 - 0.7s) ===
    const boomStart = now + 0.25;
    // Generate white noise buffer
    const noiseDuration = 0.5;
    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * noiseDuration, ctx.sampleRate);
    const noiseData = noiseBuffer.getChannelData(0);
    for(let i = 0; i < noiseData.length; i++){
      noiseData[i] = (Math.random() * 2 - 1);
    }
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "lowpass";
    noiseFilter.frequency.setValueAtTime(800, boomStart);
    noiseFilter.frequency.exponentialRampToValueAtTime(150, boomStart + 0.45);
    noiseFilter.Q.value = 1.5;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.45, boomStart);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, boomStart + 0.45);
    noiseSrc.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noiseSrc.start(boomStart);
    noiseSrc.stop(boomStart + noiseDuration);

    // Sub-bass thump for the BOOM
    const subOsc = ctx.createOscillator();
    const subGain = ctx.createGain();
    subOsc.type = "sine";
    subOsc.frequency.setValueAtTime(80, boomStart);
    subOsc.frequency.exponentialRampToValueAtTime(35, boomStart + 0.4);
    subGain.gain.setValueAtTime(0.5, boomStart);
    subGain.gain.exponentialRampToValueAtTime(0.001, boomStart + 0.4);
    subOsc.connect(subGain).connect(ctx.destination);
    subOsc.start(boomStart);
    subOsc.stop(boomStart + 0.45);

    // === 3. CRACKLES / SPARKLES (0.4 - 1.4s) — the "fizzle" tail ===
    const crackleCount = 12 + Math.floor(Math.random() * 8);
    for(let i = 0; i < crackleCount; i++){
      const t = now + 0.4 + Math.random() * 0.9;
      const crackleOsc = ctx.createOscillator();
      const crackleGain = ctx.createGain();
      crackleOsc.type = "square";
      crackleOsc.frequency.setValueAtTime(2500 + Math.random() * 4000, t);
      crackleGain.gain.setValueAtTime(0, t);
      crackleGain.gain.linearRampToValueAtTime(0.04 + Math.random() * 0.04, t + 0.005);
      crackleGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04 + Math.random() * 0.06);
      crackleOsc.connect(crackleGain).connect(ctx.destination);
      crackleOsc.start(t);
      crackleOsc.stop(t + 0.12);
    }

    // === 4. Bright sparkle bell (0.3s) ===
    const bellOsc = ctx.createOscillator();
    const bellGain = ctx.createGain();
    bellOsc.type = "sine";
    const bellFreq = 1800 + Math.random() * 1400;
    bellOsc.frequency.setValueAtTime(bellFreq, boomStart);
    bellGain.gain.setValueAtTime(0.12, boomStart + 0.05);
    bellGain.gain.exponentialRampToValueAtTime(0.001, boomStart + 0.4);
    bellOsc.connect(bellGain).connect(ctx.destination);
    bellOsc.start(boomStart + 0.05);
    bellOsc.stop(boomStart + 0.45);
  },
};

/* ============== GENERATOR ============== */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function isValid(grid, r, c, val, size, bRows, bCols){
  for(let i=0;i<size;i++){
    if(grid[r][i]===val) return false;
    if(grid[i][c]===val) return false;
  }
  const br = Math.floor(r/bRows)*bRows;
  const bc = Math.floor(c/bCols)*bCols;
  for(let i=0;i<bRows;i++){
    for(let j=0;j<bCols;j++){
      if(grid[br+i][bc+j]===val) return false;
    }
  }
  return true;
}

function fillGrid(grid, size, bRows, bCols){
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      if(grid[r][c]===0){
        const nums = shuffle([...Array(size).keys()].map(n=>n+1));
        for(const n of nums){
          if(isValid(grid,r,c,n,size,bRows,bCols)){
            grid[r][c]=n;
            if(fillGrid(grid,size,bRows,bCols)) return true;
            grid[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function generateSolution(size, bRows, bCols){
  const grid = Array.from({length:size},()=>Array(size).fill(0));
  fillGrid(grid, size, bRows, bCols);
  return grid;
}

function makePuzzle(solution, holes){
  const size = solution.length;
  const puzzle = solution.map(row=>row.slice());
  const positions = [];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) positions.push([r,c]);
  shuffle(positions);
  for(let i=0;i<Math.min(holes,positions.length);i++){
    const [r,c]=positions[i];
    puzzle[r][c]=0;
  }
  return puzzle;
}

function getBlockDims(size){
  if(size===3) return {bRows:1,bCols:3};
  if(size===6) return {bRows:2,bCols:3};
  if(size===9) return {bRows:3,bCols:3};
}

function startGame(size){
  State.size = size;
  const dims = getBlockDims(size);
  State.blockRows = dims.bRows;
  State.blockCols = dims.bCols;
  State.solution = generateSolution(size, dims.bRows, dims.bCols);
  const holesByCount = { 3: 4, 6: 16, 9: 40 };
  State.puzzle = makePuzzle(State.solution, holesByCount[size]);
  State.grid = State.puzzle.map(r=>r.slice());
  State.selected = null;
  document.getElementById("levelPill").textContent = `Sudoku ${size}×${size}`;
  renderBoard();
  renderNumberPad();
  showScreen("game");
}

/* ============== RENDER ============== */
function getBoardSize(){
  // Determine layout mode: side-by-side on wide screens, stacked otherwise
  const isWide = window.innerWidth > 820;
  const vh = window.innerHeight;
  const vw = window.innerWidth;

  if(isWide){
    // PC layout: board on left, pad column on right — must fit horizontally and vertically
    const headerH = 80;
    const verticalPadding = 40;
    const availH = vh - headerH - verticalPadding;

    // Reserve space for the pad column (2 cols of buttons + gap)
    const padColumnW = 230; // ~2 buttons + gap
    const logoSpace = 180;
    const horizontalGap = 60;
    const availW = vw - padColumnW - logoSpace - horizontalGap;

    let target = Math.min(availW, availH, 600);
    if(target < 240) target = 240;
    return Math.floor(target);
  } else {
    // Stacked layout: header on top, board, pad row below.
    // Use real measured DOM heights when possible.
    const gameEl = document.getElementById("game");
    const headerEl = document.querySelector(".game-header");
    const padEl = document.getElementById("numberPad");

    const gameStyle = gameEl ? getComputedStyle(gameEl) : null;
    const padTop = gameStyle ? parseFloat(gameStyle.paddingTop) : 80;
    const padBottom = gameStyle ? parseFloat(gameStyle.paddingBottom) : 20;

    const headerH = headerEl ? (headerEl.offsetHeight + 12) : 60;

    // Estimate pad button size and pad row height
    const padBtnSize = Math.min(64, Math.floor((vw - 24) / (State.size + 1)) - 6);
    const padReserved = padBtnSize + 24; // pad + gap to board

    const availH = vh - padTop - padBottom - headerH - padReserved;
    const availW = vw - 28;

    let target = Math.min(availW, availH, 580);
    if(target < 200) target = 200;
    return Math.floor(target);
  }
}

function renderBoard(){
  const board = document.getElementById("board");
  const size = State.size;
  board.innerHTML = "";
  const total = getBoardSize();
  const cellSize = Math.floor(total / size);
  const realTotal = cellSize * size;
  board.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
  board.style.width = realTotal + "px";

  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.style.fontSize = Math.floor(cellSize*0.55) + "px";
      const v = State.grid[r][c];
      const fixed = State.puzzle[r][c] !== 0;
      if(fixed){
        cell.classList.add("fixed");
        cell.textContent = v;
      } else {
        cell.classList.add("user");
        cell.textContent = v === 0 ? "" : v;
      }
      if(size > 3){
        if((c+1) % State.blockCols === 0 && c !== size-1) cell.classList.add("b-right");
        if((r+1) % State.blockRows === 0 && r !== size-1) cell.classList.add("b-bottom");
      }
      cell.addEventListener("click", () => selectCell(r,c));
      board.appendChild(cell);
    }
  }
}

function selectCell(r,c){
  if(State.puzzle[r][c] !== 0) return;
  State.selected = {r,c};
  Sound.select();
  highlight();
}

function highlight(){
  const cells = document.querySelectorAll(".cell");
  cells.forEach(cell=>{
    cell.classList.remove("selected","same-num","error");
    const cr = +cell.dataset.r, cc = +cell.dataset.c;
    if(State.selected && State.selected.r===cr && State.selected.c===cc){
      cell.classList.add("selected");
    }
    if(State.selected){
      const selVal = State.grid[State.selected.r][State.selected.c];
      const cellVal = State.grid[cr][cc];
      if(selVal !== 0 && cellVal === selVal && !(cr===State.selected.r && cc===State.selected.c)){
        cell.classList.add("same-num");
      }
    }
  });
}

function renderNumberPad(){
  const pad = document.getElementById("numberPad");
  const size = State.size;
  pad.innerHTML = "";

  const isWide = window.innerWidth > 820;
  const totalButtons = size + 1; // numbers + erase
  let cols, rows, btnSize, maxW, maxH;

  if(isWide){
    // Vertical-ish grid next to the board.
    // Use 2 columns to keep it compact and tall.
    if(size === 3){
      cols = 2; rows = 2;
    } else if(size === 6){
      cols = 2; rows = Math.ceil(totalButtons / 2);
    } else { // 9
      cols = 2; rows = Math.ceil(totalButtons / 2);
    }
    // Size buttons to fit board height
    const boardSize = getBoardSize();
    const gap = 8;
    btnSize = Math.floor((boardSize - (rows-1)*gap) / rows);
    btnSize = Math.min(btnSize, 90);
    btnSize = Math.max(btnSize, 44);
    maxW = (btnSize * cols) + (cols-1)*gap;
    maxH = (btnSize * rows) + (rows-1)*gap;
    pad.style.gridTemplateColumns = `repeat(${cols}, ${btnSize}px)`;
    pad.style.gridAutoRows = `${btnSize}px`;
    pad.style.width = maxW + "px";
    pad.style.maxWidth = "none";
  } else {
    // Stacked below board: single horizontal row, sized so it fits within the reserved space
    cols = size + 1;
    const availW = Math.min(window.innerWidth - 24, 720);
    btnSize = Math.floor(availW / cols) - 6;
    // Cap button size on tablets so they do not look oversized
    btnSize = Math.min(btnSize, 64);
    btnSize = Math.max(btnSize, 32);
    const padW = btnSize * cols + (cols-1) * 6;
    pad.style.gridTemplateColumns = `repeat(${cols}, ${btnSize}px)`;
    pad.style.gridAutoRows = `${btnSize}px`;
    pad.style.width = padW + "px";
    pad.style.maxWidth = "100%";
  }

  const fontSize = Math.max(16, Math.floor(btnSize*0.5));

  for(let n=1;n<=size;n++){
    const b = document.createElement("button");
    b.textContent = n;
    b.style.fontSize = fontSize + "px";
    if(!isWide){ b.style.aspectRatio = "1"; }
    else { b.style.aspectRatio = "1"; }
    b.addEventListener("click", () => placeNumber(n));
    pad.appendChild(b);
  }
  const erase = document.createElement("button");
  erase.className = "erase";
  erase.textContent = "⌫";
  erase.style.fontSize = fontSize + "px";
  erase.style.aspectRatio = "1";
  erase.addEventListener("click", () => placeNumber(0));
  pad.appendChild(erase);
}

function placeNumber(n){
  if(!State.selected) return;
  const {r,c} = State.selected;
  if(State.puzzle[r][c] !== 0) return;
  State.grid[r][c] = n;
  const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  cell.textContent = n === 0 ? "" : n;
  if(n === 0) Sound.erase(); else Sound.place();
  highlight();
  // Auto-check when grid is fully filled
  if(n !== 0 && isComplete()){
    setTimeout(checkSolution, 250);
  }
}

function clearAll(){
  for(let r=0;r<State.size;r++){
    for(let c=0;c<State.size;c++){
      if(State.puzzle[r][c]===0) State.grid[r][c]=0;
    }
  }
  Sound.erase();
  renderBoard();
}

/* ============== CHECK ============== */
function isComplete(){
  for(let r=0;r<State.size;r++)
    for(let c=0;c<State.size;c++)
      if(State.grid[r][c]===0) return false;
  return true;
}

function findErrors(){
  const errors = [];
  const size = State.size;
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      if(State.puzzle[r][c]===0 && State.grid[r][c] !== State.solution[r][c] && State.grid[r][c] !== 0){
        errors.push([r,c]);
      }
    }
  }
  return errors;
}

function checkSolution(){
  Sound.click();
  if(!isComplete()){
    showFail();
    return;
  }
  const errs = findErrors();
  if(errs.length === 0){
    showWin();
  } else {
    errs.forEach(([r,c])=>{
      const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if(cell) cell.classList.add("error");
    });
    showFail();
  }
}

/* ============== SCREENS & OVERLAYS ============== */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  hideOverlays();
  stopFireworks();
}

function showFail(){
  document.getElementById("failOverlay").classList.add("active");
  Sound.fail();
}
function showWin(){
  document.getElementById("winBanner").classList.add("active");
  startFireworks();
  Sound.win();
}
function hideOverlays(){
  document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("active"));
  document.getElementById("winBanner").classList.remove("active");
}

/* ============== FIREWORKS (transparent canvas) ============== */
const fwCanvas = document.getElementById("fireworks-canvas");
const fwCtx = fwCanvas.getContext("2d");
let fwRunning = false;
let fwParticles = [];
let fwLastLaunch = 0;
let fwAnimId = null;

function resizeFw(){
  const dpr = window.devicePixelRatio || 1;
  fwCanvas.width = window.innerWidth * dpr;
  fwCanvas.height = window.innerHeight * dpr;
  fwCanvas.style.width = window.innerWidth + "px";
  fwCanvas.style.height = window.innerHeight + "px";
  fwCtx.setTransform(1,0,0,1,0,0);
  fwCtx.scale(dpr, dpr);
}
window.addEventListener("resize", resizeFw);
resizeFw();

const FW_COLORS = ["#FFD23F","#FF6B6B","#06D6A0","#5BC0EB","#9B5DE5","#F4A300","#FF8FA3","#FFFFFF"];

function launchFirework(x, y){
  if(typeof x !== "number") x = Math.random() * window.innerWidth * 0.8 + window.innerWidth*0.1;
  if(typeof y !== "number") y = Math.random() * window.innerHeight * 0.5 + window.innerHeight*0.1;
  const color = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  const count = 50 + Math.floor(Math.random()*30);
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.1;
    const speed = 2 + Math.random()*4;
    fwParticles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1,
      decay: 0.012 + Math.random()*0.015,
      color,
      size: 2 + Math.random()*2.5,
      trail: [],
    });
  }
  Sound.fireworkBoom();
}

function fwLoop(t){
  if(!fwRunning){
    fwAnimId = null;
    return;
  }

  // Soft fade for trails (fully transparent canvas — no dark background)
  fwCtx.clearRect(0,0,window.innerWidth,window.innerHeight);

  if(t - fwLastLaunch > 700){
    launchFirework();
    fwLastLaunch = t;
  }

  for(let i=fwParticles.length-1;i>=0;i--){
    const p = fwParticles[i];
    // store trail
    p.trail.push({x:p.x, y:p.y, life:p.life});
    if(p.trail.length > 5) p.trail.shift();

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.vx *= 0.99;
    p.life -= p.decay;
    if(p.life <= 0){
      fwParticles.splice(i,1);
      continue;
    }
    // draw trail
    for(let k=0;k<p.trail.length;k++){
      const tt = p.trail[k];
      fwCtx.globalAlpha = (tt.life * 0.5) * (k/p.trail.length);
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath();
      fwCtx.arc(tt.x, tt.y, p.size*0.6, 0, Math.PI*2);
      fwCtx.fill();
    }
    // draw head with glow
    fwCtx.globalAlpha = p.life;
    fwCtx.shadowColor = p.color;
    fwCtx.shadowBlur = 12;
    fwCtx.fillStyle = p.color;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    fwCtx.fill();
    fwCtx.shadowBlur = 0;
  }
  fwCtx.globalAlpha = 1;
  fwAnimId = requestAnimationFrame(fwLoop);
}

function startFireworks(){
  fwCanvas.classList.add("active");
  fwRunning = true;
  fwParticles = [];
  fwLastLaunch = 0;
  for(let i=0;i<3;i++) setTimeout(()=>launchFirework(), i*250);
  if(!fwAnimId) fwAnimId = requestAnimationFrame(fwLoop);
}
function stopFireworks(){
  fwRunning = false;
  fwCanvas.classList.remove("active");
  fwCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  fwParticles = [];
  if(fwAnimId){
    cancelAnimationFrame(fwAnimId);
    fwAnimId = null;
  }
}

/* Tap on fireworks → dismiss + clear sudoku */
fwCanvas.addEventListener("click", onFireworksTap);
fwCanvas.addEventListener("touchstart", (e)=>{ e.preventDefault(); onFireworksTap(); }, {passive:false});

function onFireworksTap(){
  Sound.pop();
  stopFireworks();
  hideOverlays();
  // Empty the sudoku (keep same level, clear user inputs AND fixed ones — generate new puzzle of same size)
  // The user said "vider le sudoku" -> empty it. We start a fresh same-level puzzle.
  startGame(State.size);
}

/* ============== EVENTS ============== */
document.querySelectorAll(".diff-card").forEach(card=>{
  card.addEventListener("click", () => {
    Sound.click();
    const size = parseInt(card.dataset.size,10);
    startGame(size);
  });
});

document.getElementById("backBtn").addEventListener("click", ()=>{Sound.click(); showScreen("home");});
document.getElementById("clearBtn").addEventListener("click", ()=>{ clearAll(); });

document.getElementById("cornerLogo").addEventListener("click", ()=>{
  Sound.click();
  showScreen("home");
});

document.getElementById("soundBtn").addEventListener("click", ()=>{
  State.soundOn = !State.soundOn;
  document.getElementById("soundBtn").textContent = State.soundOn ? "🔊" : "🔇";
  if(State.soundOn) Sound.click();
});

function continueAfterFail(){
  Sound.erase();
  // Erase ONLY the wrong digits; keep correct user-entered digits
  // A digit is "wrong" if it was entered by the user AND does not match the solution
  for(let r = 0; r < State.size; r++){
    for(let c = 0; c < State.size; c++){
      // Skip fixed (puzzle) cells — those were given and never wrong
      if(State.puzzle[r][c] !== 0) continue;
      const v = State.grid[r][c];
      if(v !== 0 && v !== State.solution[r][c]){
        State.grid[r][c] = 0;
      }
    }
  }
  hideOverlays();
  // Re-render to reflect the cleared cells (and remove .error classes)
  renderBoard();
  highlight();
}

document.getElementById("continueBtn").addEventListener("click", continueAfterFail);

// Tap anywhere on the fail overlay (background or modal) to continue
document.getElementById("failOverlay").addEventListener("click", (e)=>{
  // Don't trigger when the user clicked the "Changer de Sudoku" button
  if(e.target.closest("#changeBtn")) return;
  continueAfterFail();
});
document.getElementById("changeBtn").addEventListener("click", ()=>{
  Sound.click();
  hideOverlays();
  showScreen("home");
});

/* Keyboard support */
document.addEventListener("keydown", (e)=>{
  if(!document.getElementById("game").classList.contains("active")) return;
  if(!State.selected) return;
  if(e.key >= "1" && e.key <= "9"){
    const n = parseInt(e.key,10);
    if(n <= State.size) placeNumber(n);
  } else if(e.key === "Backspace" || e.key === "Delete" || e.key === "0"){
    placeNumber(0);
  } else if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();
    let {r,c} = State.selected;
    if(e.key==="ArrowUp") r=Math.max(0,r-1);
    if(e.key==="ArrowDown") r=Math.min(State.size-1,r+1);
    if(e.key==="ArrowLeft") c=Math.max(0,c-1);
    if(e.key==="ArrowRight") c=Math.min(State.size-1,c+1);
    State.selected = {r,c};
    highlight();
  }
});

/* Resize handler — rerender board if game active */
let resizeTimer;
window.addEventListener("resize", ()=>{
  resizeFw();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(document.getElementById("game").classList.contains("active")){
      renderBoard();
      renderNumberPad();
      highlight();
    }
  }, 150);
});

/* Unlock audio on first user interaction (mobile requirement) */
document.addEventListener("click", ensureAudio, {once:true});
document.addEventListener("touchstart", ensureAudio, {once:true});
</script>
